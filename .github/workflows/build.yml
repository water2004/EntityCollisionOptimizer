name: Build Fabric 1.21.1

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build-and-package:
    name: Cross-Compile & Build Mod
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Select Java 21 for Gradle and retain Java 25 toolchain
        shell: pwsh
        run: '"ORG_GRADLE_PROJECT_org.gradle.java.installations.paths=$env:JAVA_HOME" >> $env:GITHUB_ENV'

      - name: Setup Java 21 for Gradle 8
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        run: ./gradlew build --stacktrace

      - name: Run contract and unit GameTests
        run: ./gradlew runGameTest -PunitTest --stacktrace

      - name: Run cross-process integration GameTests
        run: ./gradlew runGameTest -PintegrationTest --stacktrace

      - name: Upload Mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EntityCollisionOptimizer-${{ github.sha }}-build-${{ github.run_number }}
          path: build/libs/*.jar
          retention-days: 14
