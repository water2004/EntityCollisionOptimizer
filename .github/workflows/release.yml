name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag'
    name: Build, test and publish
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $metadata = & ./.github/scripts/release-metadata.ps1
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checked-out commit.' }
          git merge-base --is-ancestor $commit "origin/$($metadata.Branch)"
          if ($LASTEXITCODE -ne 0) { throw "Release tag must point to a commit on $($metadata.Branch)." }
          "version=$($metadata.Version)" >> $env:GITHUB_OUTPUT
          "minecraft=$($metadata.Minecraft)" >> $env:GITHUB_OUTPUT
          "tag=$($metadata.Tag)" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          if ($metadata.CreatesRelease -and -not (Test-Path -LiteralPath $metadata.NotesFile)) {
            throw "Missing release notes: $($metadata.NotesFile)"
          }

      - name: Set up Microsoft JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: microsoft
          java-version: "25"
          cache: gradle

      - name: Check release scripts
        shell: pwsh
        run: ./.github/scripts/test-release.ps1

      - name: Build release artifacts
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon "-PreleaseVersion=${{ steps.release.outputs.version }}"

      - name: Run correctness GameTests
        shell: pwsh
        run: |
          .\gradlew.bat runGameTest -PunitTest --no-daemon "-PreleaseVersion=${{ steps.release.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw 'Contract and unit GameTests failed.' }
          .\gradlew.bat runGameTest -PintegrationTest --no-daemon "-PreleaseVersion=${{ steps.release.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw 'Cross-process integration GameTests failed.' }

      - name: Verify and stage artifacts
        shell: pwsh
        run: |
          ./.github/scripts/stage-release.ps1 -Version '${{ steps.release.outputs.version }}' -Minecraft '${{ steps.release.outputs.minecraft }}' -Commit '${{ steps.release.outputs.commit }}'

      - name: Preserve tested artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mc${{ steps.release.outputs.minecraft }}-${{ github.sha }}
          path: |
            dist/*.jar
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create release or append version assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/publish-release.ps1 -Commit '${{ steps.release.outputs.commit }}'
