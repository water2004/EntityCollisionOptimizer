repositories {
    ivy {
        // Reuse the upstream cross-compilation toolchain. The archive contains
        // compilers and sysroots only; this repository owns the native sources.
        name = "Upstream Cross-Compilation Toolchain"
        url = "https://github.com/wiyuka-owo/AcceleratedRecoiling/releases/download"
        patternLayout {
            artifact "[revision]/[artifact].[ext]"
        }
        metadataSources { artifact() }
    }
}

configurations {
    cppToolchain
}

dependencies {
    cppToolchain "com.wiyuka.env:AcceleratedRecoiling-third-party:toolchain_20260601_0@zip"
}

def cppProjectDir = file("./native")
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
def nativeSymbols = providers.gradleProperty("nativeSymbols").isPresent() ? "ON" : "OFF"
def nativeAvx2 = providers.gradleProperty("nativeAvx2").orElse("true").get().toBoolean() ? "ON" : "OFF"

def registerNativeTask = { String taskName, String targetName, String cmakeScriptName, String description ->
    return tasks.register(taskName, Exec) {
        group = "build native"
        dependsOn "extractToolchain"
        onlyIf { isWindows }
        workingDir = cppProjectDir
        def envScript = file("${cppProjectDir}/env/add_env.bat").absolutePath
        def outputDir = file("${cppProjectDir}/out/entity-collision-optimizer/${targetName}").absolutePath

        commandLine 'cmd', '/c', "call \"${envScript}\" && " +
                "call \"%AR_TOOLCHAIN%\\bin\\${cmakeScriptName}\" " +
                "-DCMAKE_BUILD_TYPE=Release -DECO_NATIVE_SYMBOLS=${nativeSymbols} -DECO_NATIVE_AVX2=${nativeAvx2} \"${cppProjectDir.absolutePath}\" -B \"${outputDir}\" && " +
                "call \"%AR_TOOLCHAIN%\\bin\\cmake-build.bat\" \"${outputDir}\""

        doFirst {
            println "> 开始编译 ${description} (${targetName}, FFM)"
        }
    }
}

tasks.register("extractToolchain", Copy) {
    group = "build native"
    dependsOn configurations.cppToolchain
    onlyIf {
        !new File(cppProjectDir, "env/add_env.bat").exists()
    }

    from({ zipTree(configurations.cppToolchain.singleFile) }) {
        // The release archive supplies compilers and sysroots only. Native
        // project sources are versioned in this repository.
        exclude "src/**"
        exclude "include/**"
        exclude "README.md"
        exclude "CMakeLists.txt"
        exclude "version-script"
    }
    into cppProjectDir
    doLast {
        println "> 解压完成"
    }
}

def compileWin = registerNativeTask("compileNativeWin", "win-x64", "x86_64-windows-msvc-cmake.bat", "Windows 动态库")
def compileLinux = registerNativeTask("compileNativeLinux", "linux-x64", "x86_64-linux-gnu-cmake.bat", "Linux 动态库")
def compileMac = registerNativeTask("compileNativeMac", "macos-x64", "x86_64-apple-macos-cmake.bat", "macOS 动态库")

def generatedNativeResources = layout.buildDirectory.dir("generated/nativeResources")
def nativeOutputRoot = new File(cppProjectDir, "out/entity-collision-optimizer")
def nativeLibraryFiles = files(
        new File(nativeOutputRoot, "win-x64/EntityCollisionOptimizer.dll"),
        new File(nativeOutputRoot, "win-x64/EntityCollisionOptimizerUnordered.dll"),
        new File(nativeOutputRoot, "linux-x64/libEntityCollisionOptimizer.so"),
        new File(nativeOutputRoot, "linux-x64/libEntityCollisionOptimizerUnordered.so"),
        new File(nativeOutputRoot, "macos-x64/libEntityCollisionOptimizer.dylib"),
        new File(nativeOutputRoot, "macos-x64/libEntityCollisionOptimizerUnordered.dylib")
)
def prepareNativeResources = tasks.register("prepareNativeResources") {
    group = "build native"
    dependsOn compileWin, compileLinux, compileMac
    inputs.files(nativeLibraryFiles)
    outputs.dir(generatedNativeResources)

    doLast {
        nativeLibraryFiles.each { nativeLibrary ->
            if (!nativeLibrary.isFile()) {
                throw new GradleException("Native build did not produce ${nativeLibrary}")
            }
        }
        project.sync { copySpec ->
            copySpec.into generatedNativeResources

            copySpec.from(new File(nativeOutputRoot, "win-x64")) {
                include "EntityCollisionOptimizer.dll"
                include "EntityCollisionOptimizerUnordered.dll"
                into "natives/windows-x64"
            }
            copySpec.from(new File(nativeOutputRoot, "linux-x64")) {
                include "libEntityCollisionOptimizer.so"
                include "libEntityCollisionOptimizerUnordered.so"
                into "natives/linux-x64"
            }
            copySpec.from(new File(nativeOutputRoot, "macos-x64")) {
                include "libEntityCollisionOptimizer.dylib"
                include "libEntityCollisionOptimizerUnordered.dylib"
                into "natives/macos-x64"
            }
        }
    }
}

// Make the native libraries available both to the packaged JAR and Loom dev runs.
// They are generated outputs, not source resources, so they stay out of sourcesJar.
sourceSets.main.output.dir(generatedNativeResources, builtBy: prepareNativeResources)
