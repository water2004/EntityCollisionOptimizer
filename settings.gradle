pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'EntityCollisionOptimizer'

// The vanilla side of the cross-process parity test is a standalone test mod.
// Keep it out of normal builds so the published project remains single-module.
if (gradle.startParameter.projectProperties.containsKey('parity')) {
    include 'vanilla-gametest'
}
