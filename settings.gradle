pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // The foojay toolchain resolver was only needed to auto-provision the Java 25
    // toolchain. The 1.21.11 target pins the toolchain to Java 21 (the FFM API is
    // still preview on 21, so the compiler must be exactly 21), which must be
    // installed locally / by the CI setup-java step. Removing the resolver keeps
    // offline builds working.
}

rootProject.name = 'EntityCollisionOptimizer'
