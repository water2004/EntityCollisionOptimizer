plugins {
    // Matches the main build: 1.21.11 still runs in the intermediary namespace, so the
    // remapping plugin and explicit mappings are required.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = '1.0.0'
group = 'org.edtp'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

sourceSets.main.java.srcDir(file('../src/integrationTest/java'))
sourceSets.main.resources.srcDir(file('../src/integrationTestShared/resources'))

fabricApi {
    configureTests {
        createSourceSet = false
        enableGameTests = true
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}

def integrationTraceDir = file('../build/gametest-baselines')

loom {
    runs {
        configureEach {
            property 'entity_collision_optimizer.integration.mode', 'record'
            property 'entity_collision_optimizer.integration.trace_dir', integrationTraceDir.absolutePath
            // The 1.21.11 target uses the Java 21 preview FFM API, so dev runs need the flag.
            vmArg '--enable-preview'
            vmArg '--enable-native-access=ALL-UNNAMED'
        }
    }
}

tasks.named('runGameTest') {
    doFirst {
        delete integrationTraceDir
        delete layout.buildDirectory.dir('run/gameTest/world')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['--enable-preview']
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
