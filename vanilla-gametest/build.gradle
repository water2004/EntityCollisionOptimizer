plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = '1.0.0'
group = 'org.edtp'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

sourceSets.main.java.srcDir(rootProject.file('src/crammingTest/java'))

fabricApi {
    configureTests {
        createSourceSet = false
        enableGameTests = true
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}

def crammingTrace = rootProject.layout.buildDirectory.file('gametest-baselines/zombie-cramming.bin')

loom {
    runs {
        configureEach {
            property 'entity_collision_optimizer.cramming.mode', 'record'
            property 'entity_collision_optimizer.cramming.trace', crammingTrace.get().asFile.absolutePath
            property 'fabric-api.gametest.filter', 'entity_collision_optimizer-vanilla-gametest:zombie_cramming_parity_game_tests_real_zombie_cramming_parity'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
