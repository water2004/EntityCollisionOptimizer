plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = '1.0.0'
group = 'org.edtp'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

sourceSets.main.java.srcDir(file('../src/integrationTest/java'))
sourceSets.main.resources.srcDir(file('../src/integrationTestShared/resources'))

fabricApi {
    configureTests {
        createSourceSet = false
        enableGameTests = true
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}

def integrationTraceDir = file('../build/gametest-baselines')

loom {
    runs {
        configureEach {
            property 'entity_collision_optimizer.integration.mode', 'record'
            property 'entity_collision_optimizer.integration.trace_dir', integrationTraceDir.absolutePath
        }
    }
}

tasks.named('runGameTest') {
    doFirst {
        delete integrationTraceDir
        delete layout.buildDirectory.dir('run/gameTest/world')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 22
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// Match the optimized process JVM while keeping this classpath free of ECO.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    executable = javaToolchains.launcherFor(java.toolchain).get().executablePath.asFile.absolutePath
}
