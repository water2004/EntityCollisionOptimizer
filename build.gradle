plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    runs {
        configureEach {
            vmArg "--enable-native-access=ALL-UNNAMED"
            if (providers.gradleProperty("benchmark").isPresent()) {
                vmArg "-Dacceleratedrecoiling.runBenchmark=true"
            }
            if (providers.gradleProperty("jfrOutput").isPresent()) {
                vmArg "-XX:StartFlightRecording=filename=${file(providers.gradleProperty("jfrOutput").get()).absolutePath},settings=profile,dumponexit=true"
            }
        }
    }
}

// The 1000-entity benchmark is opt-in so normal builds do not start a game server.
if (providers.gradleProperty("benchmark").isPresent()
        || providers.gradleProperty("parity").isPresent()) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "acceleratedrecoiling-gametest"
            enableGameTests = true
            eula = true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    if (providers.gradleProperty("compatModsDir").isPresent()) {
        runtimeOnly fileTree(
                dir: providers.gradleProperty("compatModsDir").get(),
                include: ["*.jar"]
        )
    }
}

def modVersion = version.toString()

processResources {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

def archiveBaseName = project.archives_base_name

jar {
    inputs.property "archiveBaseName", archiveBaseName

    from("LICENSE") {
        rename { "${it}_${archiveBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

def cppScript = file('cpp-build.gradle')
if (cppScript.exists()) {
    apply from: cppScript
}
