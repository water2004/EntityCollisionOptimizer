plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    runs {
        configureEach {
            vmArg "--enable-native-access=ALL-UNNAMED"
            vmArg "--add-modules=jdk.incubator.vector"
        }
    }
}

// The 1000-entity benchmark is opt-in so normal builds do not start a game server.
if (providers.gradleProperty("benchmark").isPresent()) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "acceleratedrecoiling-gametest"
            enableGameTests = true
            eula = true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    def joclVersion = "2.0.5"
    implementation "org.jocl:jocl:${joclVersion}"
    include "org.jocl:jocl:${joclVersion}"
}

def modVersion = version.toString()

processResources {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs.addAll(["--add-modules", "jdk.incubator.vector"])
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

def archiveBaseName = project.archives_base_name

jar {
    inputs.property "archiveBaseName", archiveBaseName

    from("LICENSE") {
        rename { "${it}_${archiveBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

def cppScript = file('cpp-build.gradle')
if (cppScript.exists()) {
    apply from: cppScript
}
