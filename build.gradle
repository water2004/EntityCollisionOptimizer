plugins {
    // Minecraft 1.21.11 still ships obfuscated, so mods must be published in the
    // intermediary namespace: the remapping Loom plugin is required. (26.x moved
    // to Mojang official names at runtime, which is why main used the no-remap id.)
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

def releaseVersion = providers.gradleProperty("releaseVersion")
        .orElse(providers.gradleProperty("mod_version"))
        .get()
def numericIdentifier = /(?:0|[1-9][0-9]*)/
def minecraftIdentifier = /[0-9]+(?:\.[0-9]+)+/
def semanticVersion = /${numericIdentifier}\.${numericIdentifier}\.${numericIdentifier}/
def stableVersionPattern = ~/^${semanticVersion}\+mc(${minecraftIdentifier})$/
def prereleaseVersionPattern = ~/^${semanticVersion}-mc(${minecraftIdentifier})-alpha\.${numericIdentifier}$/
def stableVersionMatch = releaseVersion =~ stableVersionPattern
def prereleaseVersionMatch = releaseVersion =~ prereleaseVersionPattern
def isStableVersion = stableVersionMatch.matches()
def isPrereleaseVersion = prereleaseVersionMatch.matches()

if (!isStableVersion && !isPrereleaseVersion) {
    throw new GradleException(
            "Invalid mod version '${releaseVersion}'. Expected X.Y.Z+mc${minecraft_version} "
                    + "or X.Y.Z-mc${minecraft_version}-alpha.N"
    )
}

def targetMinecraftVersion = isStableVersion
        ? stableVersionMatch.group(1)
        : prereleaseVersionMatch.group(1)
if (targetMinecraftVersion != minecraft_version.toString()) {
    throw new GradleException(
            "Mod version '${releaseVersion}' targets Minecraft ${targetMinecraftVersion}, "
                    + "but minecraft_version is ${minecraft_version}"
    )
}

version = releaseVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

def unitTestsEnabled = providers.gradleProperty("unitTest").isPresent()
def integrationTestsEnabled = providers.gradleProperty("integrationTest").isPresent()
def benchmarksEnabled = providers.gradleProperty("benchmark").isPresent()
def enabledTestSuites = ((unitTestsEnabled ? 1 : 0)
        + (integrationTestsEnabled ? 1 : 0)
        + (benchmarksEnabled ? 1 : 0))

if (enabledTestSuites > 1) {
    throw new GradleException("Choose exactly one GameTest suite: unitTest, integrationTest, or benchmark")
}

loom {
    runs {
        configureEach {
            vmArg "--enable-native-access=ALL-UNNAMED"
            // Java 21 keeps the FFM API behind --enable-preview, so dev runs need it too.
            vmArg "--enable-preview"
            if (providers.gradleProperty("gameTestFilter").isPresent()) {
                vmArg "-Dfabric-api.gametest.filter=${providers.gradleProperty('gameTestFilter').get()}"
            }
            if (benchmarksEnabled) {
                vmArg "-Dentity_collision_optimizer.runBenchmark=true"
            }
            // A/B hook for the benchmark suite: replay the same workload on the vanilla paths.
            if (providers.gradleProperty("ecoVanillaPaths").isPresent()) {
                vmArg "-Deco.benchmark.vanillaPaths=true"
            }
            if (providers.gradleProperty("jfrOutput").isPresent()) {
                vmArg "-XX:StartFlightRecording=filename=${file(providers.gradleProperty("jfrOutput").get()).absolutePath},settings=profile,dumponexit=true"
            }
            // Optional local profiler only; never instrument Gradle or package this agent.
            if (providers.gradleProperty("jitMapAgent").isPresent()) {
                def agent = file(providers.gradleProperty("jitMapAgent").get()).absolutePath
                def output = file(providers.gradleProperty("jitMapOutput").get()).absolutePath
                vmArg "-agentpath:${agent}=${output}"
            }
        }
    }
}

// Correctness suites and performance benchmarks are explicit; normal builds do not start a server.
if (enabledTestSuites == 1) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "entity_collision_optimizer-gametest"
            enableGameTests = true
            eula = true
            clearRunDirectory = true
        }
    }

    if (integrationTestsEnabled) {
        def integrationTraceDir = layout.buildDirectory.dir("gametest-baselines")
        def recordVanillaIntegrationTrace = tasks.register("recordVanillaIntegrationTrace", GradleBuild) {
            dir = file("vanilla-gametest")
            tasks = ["runGameTest"]
            // Propagate the offline flag so offline builds do not try to reach the network.
            startParameter.offline = gradle.startParameter.offline
        }

        sourceSets.gametest.java.setSrcDirs(["src/integrationTest/java"])
        sourceSets.gametest.resources.setSrcDirs([
                "src/integrationTest/resources",
                "src/integrationTestShared/resources"
        ])
        loom.runs.named("gameTest") {
            property "entity_collision_optimizer.integration.mode", "compare"
            property "entity_collision_optimizer.integration.trace_dir", integrationTraceDir.get().asFile.absolutePath
        }
        tasks.named("runGameTest") {
            dependsOn recordVanillaIntegrationTrace
            doFirst {
                // The generated cleanup task runs before the vanilla-recording dependency.
                // Delete again at the actual optimized-process boundary so unit-test worlds
                // cannot leak persistent chunks into the integration comparison.
                delete layout.buildDirectory.dir("run/gameTest/world")
            }
        }
    } else {
        sourceSets.gametest.java.setSrcDirs(["src/gametest/java"])
        sourceSets.gametest.resources.setSrcDirs([
                "src/gametest/resources",
                unitTestsEnabled ? "src/unitTest/resources" : "src/benchmarkTest/resources"
        ])
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    if (providers.gradleProperty("compatModsDir").isPresent()) {
        runtimeOnly fileTree(
                dir: providers.gradleProperty("compatModsDir").get(),
                include: ["*.jar"]
        )
    }
}

def modVersion = version.toString()

processResources {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

// Minecraft 1.21.11 runs on Java 21. The FFM API used by the native backend is
// still a preview API on 21, so both compilation and the game JVM need
// --enable-preview on this target.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['--enable-preview']
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

def archiveBaseName = project.archives_base_name

jar {
    inputs.property "archiveBaseName", archiveBaseName

    from("LICENSE") {
        rename { "${it}_${archiveBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

def cppScript = file('cpp-build.gradle')
if (cppScript.exists()) {
    apply from: cppScript
}
